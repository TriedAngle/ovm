[package]
name = "vm"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "ovm"
path = "src/main.rs"

[dependencies]
vm_core = { path = "../vm_core" }
interpreter_match_loop = { path = "../interpreter_match_loop" }
js_runtime = { path = "../js_runtime" }
kette_runtime = { path = "../kette_runtime" }
heap_api = { path = "../heap_api" }
bytecode = { path = "../bytecode" }
js_compiler = { path = "../js_compiler" }
kette_compiler = { path = "../kette_compiler" }
mark_sweep = { path = "../collectors/mark_sweep" }
trace = { path = "../trace" }
interpreter_become = { path = "../interpreter_become", optional = true }

[features]
stress-minor-gc = ["vm_core/stress-minor-gc"]
# Select the tail-call ("become") interpreter over the match-loop one.
# Requires a nightly toolchain (explicit_tail_calls / rust_preserve_none_cc).
fast = ["dep:interpreter_become"]
